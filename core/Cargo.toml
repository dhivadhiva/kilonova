[workspace]
resolver = "3"
members = ["kn-ffi", "kn-keys", "kn-store", "kn-sync", "kn-tx"]
# Needs nightly; see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Dhiva-Labs/kilonova"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Key derivation and curve arithmetic are unusably slow unoptimized; keep
# debug builds and tests responsive.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3

# The app ships kn_ffi as a shared library (cargokit builds it with
# `--release` against this workspace). One codegen unit with LTO lets the
# optimizer work across crates; symbols are stripped (backtraces keep
# function names only through panic messages). Panics stay `unwind`:
# flutter_rust_bridge catches them and reports them to Dart.
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
