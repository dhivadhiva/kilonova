[package]
name = "kn-sync"
description = "Full-mode sync for Kilonova: monerod transport, scanning, balances and history"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes entry points for the fuzz targets in core/fuzz.
fuzzing = []

[dependencies]
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize", "precomputed-tables"] }
hex = "0.4"
kn-keys = { path = "../kn-keys" }
monero-daemon-rpc = { version = "=0.2.0", features = ["std"] }
monero-epee = { version = "=0.2.1", default-features = false }
monero-interface = { version = "=0.2.0", features = ["std"] }
monero-wallet = { version = "=0.2.0", default-features = false, features = ["std", "compile-time-generators"] }
# `rustls-no-provider` keeps aws-lc out (it is hard to cross-compile for
# Android); ring is installed as the provider, and roots come from
# webpki-roots so no platform verifier (which needs JNI on Android) is used.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "net", "io-util", "rt"] }
webpki-roots = "1"
zeroize = "1.8"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
curve25519-dalek = { version = "4", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true
