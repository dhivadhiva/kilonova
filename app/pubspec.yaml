name: kilonova
description: "Monero wallet with full and light-wallet sync."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.12.2

dependencies:
  dbus: ^0.7.15
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications_linux: ^8.0.1
  flutter_local_notifications_windows: ^3.1.1
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_zxing: ^3.1.0
  intl: any
  kn_ffi:
    path: rust_builder
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  unifiedpush_android: ^3.5.0
  unifiedpush_platform_interface: ^4.0.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/legal/PRIVACY.md
    - assets/fonts/OFL.txt
    - assets/icon/kilonova-256.png
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
