version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    ignore:
      # Must move in lockstep with its Dart package and the codegen.
      - dependency-name: flutter_rust_bridge
      # Cryptography and Monero crates: major versions change behaviour or
      # types (curve25519-dalek must match monero-oxide), so they are
      # upgraded by hand with the wallet-file compatibility tests. Patch and
      # minor updates still come through.
      - dependency-name: argon2
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: chacha20poly1305
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: curve25519-dalek
        update-types: ["version-update:semver-major"]
      - dependency-name: "monero-*"
      - dependency-name: polyseed
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    ignore:
      - dependency-name: flutter_rust_bridge
      # Pinned by flutter_localizations in the Flutter SDK; moves with Flutter.
      # Ignoring it alone was not enough: #32 bumped it inside a group led
      # by dbus, which broke `flutter pub get`. The two rules below keep that
      # group from forming again.
      - dependency-name: intl
      # A minor version of a 0.x package is a breaking one, and
      # flutter_local_notifications_linux has to support it first. #32 took
      # dev prereleases of both notification plugins to get dbus 0.8.
      - dependency-name: dbus
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Major versions change the shared platform interface; upgraded by
      # hand, together, and only to stable releases.
      - dependency-name: "flutter_local_notifications*"
        update-types: ["version-update:semver-major"]
